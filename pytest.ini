[pytest]
testpaths = backend-server/tests
pythonpath = backend-server
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = Combined_Disaster_Model_Package Aegis_App Aegis_updated_UI .git .expo
filterwarnings =
    ignore::DeprecationWarning
    ignore::pydantic.PydanticDeprecatedSince20
    ignore::sklearn.exceptions.InconsistentVersionWarning
    ignore:.*starlette.*:UserWarning
    ignore:.*starlette.*:DeprecationWarning
    ignore:.*StarletteDeprecationWarning.*
